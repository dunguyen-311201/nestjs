name: CI

on:
  push:
    branches: ['feat/e-commerce']
    paths:
      - 'e-commerce-with-nestjs/**'
      - '.github/workflows/e-commerce.yml'
  pull_request:
    branches: ['feat/e-commerce']
    paths:
      - 'e-commerce-with-nestjs/**'
      - '.github/workflows/e-commerce.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce-with-nestjs
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: e-commerce-with-nestjs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Code
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build Application
        run: pnpm build

      - name: Build Docker images
        run: |
          for app in api-gateway order inventory product user; do
            docker build --build-arg APP_NAME=$app -t ecommerce-$app .
          done
